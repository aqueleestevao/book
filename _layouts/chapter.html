<article class="chapter">
  <header class="chapter-header">
    {% if page.number %}
      <p class="chapter-eyebrow">{{ page.number }}</p>
    {% endif %}
    <h1 class="chapter-title">{{ page.title }}</h1>
  </header>

  <div class="chapter-body">
    {{ content }}
  </div>
</article>
